<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1e9">
<meta name="description" content="SAMUEL — Your style starts with you. Discover clothing, shoes and accessories for Women, Men, Girls, Boys and Baby.">
<title>SAMUEL — Your choice. Your style.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');
:root{--paper:#f4f1e9;--ink:#23251e;--muted:#727468;--line:#d9d8ce;--accent:#c5ce9d;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #72824e;outline-offset:6px}
::selection{background:#c5ce9d;color:#23251e}
.site-header{margin:0 4.3%;border-bottom:1px solid var(--line);height:116px;display:flex;align-items:center;justify-content:center}
.wordmark{font-family:var(--serif);font-size:clamp(48px,6.3vw,92px);font-weight:400;letter-spacing:.13em;line-height:1;text-decoration:none;color:inherit;direction:ltr;padding-left:.13em}
main{max-width:1800px;margin:auto;padding:0 4.3% 42px}
.intro{min-height:150px;display:flex;align-items:center;justify-content:space-between;gap:32px;padding:30px 0}
.eyebrow{font-size:10px;letter-spacing:.2em;font-family:Arial,sans-serif;direction:ltr;display:flex;align-items:center;gap:10px;margin:0 0 15px}
.eyebrow::before{content:"";width:6px;height:6px;background:#77814b;border-radius:50%}
h1{font-size:clamp(25px,2.5vw,39px);font-weight:400;line-height:1.65;margin:0;letter-spacing:-1px}
h1 span{color:#7d8565}
.intro-note{max-width:290px;font-size:13px;font-weight:300;line-height:2.1;margin:0;color:#62665a}
.note-line{display:block;margin-top:10px;font-size:10px;color:#454b38}
.note-line b{display:inline-block;background:var(--accent);width:25px;height:25px;text-align:center;line-height:25px;border-radius:50%;margin-right:8px;font-size:15px;font-weight:400}
.categories{direction:ltr;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:clamp(360px,55vh,620px);gap:14px}
.category{position:relative;padding:0;border:0;overflow:hidden;cursor:pointer;text-align:left;background:#e6e1d5;color:white;isolation:isolate;border-radius:2px}
.category::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(12,17,11,.7));z-index:0;transition:opacity .4s}
.category img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .85s cubic-bezier(.2,.65,.2,1),filter .5s}
.category:hover img,.category:focus-visible img{transform:scale(1.045)}
.category:hover .arrow{background:var(--paper);color:var(--ink);transform:rotate(-45deg)}
.category img{object-position:center 30%}
.category.men img{object-position:center}
.number{position:absolute;top:20px;left:20px;font-family:Arial,sans-serif;font-size:11px;letter-spacing:.12em;z-index:1;color:inherit;opacity:.9}
.category-label{position:absolute;z-index:1;bottom:25px;left:17px;right:17px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;direction:ltr}
.category-label strong{display:block;font-size:clamp(21px,2vw,28px);font-weight:500;line-height:1.7}
.category-label small{display:block;font-family:Arial,sans-serif;direction:ltr;text-align:left;font-size:8px;letter-spacing:.12em;margin-top:4px;opacity:.8}
.arrow{direction:ltr;flex-shrink:0;display:grid;place-items:center;width:37px;height:37px;border:1px solid #ffffff69;border-radius:50%;font:20px Arial,sans-serif;transition:background .3s,color .3s,transform .3s}
.caption{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0 0;font-size:10px;color:var(--muted)}
.caption .english{font-family:Arial,sans-serif;letter-spacing:.15em;font-size:9px;direction:ltr}
.caption .category-note{display:flex;align-items:center;gap:8px}
.caption .category-note::before{content:"";width:25px;height:1px;background:#969c85}
dialog{padding:0;border:0;width:min(820px,calc(100% - 32px));max-height:90dvh;background:var(--paper);color:var(--ink);overflow:auto;box-shadow:0 30px 100px #0004}
dialog::backdrop{background:#181c17a6;backdrop-filter:blur(7px)}
.dialog-grid{display:grid;grid-template-columns:1fr 1fr;min-height:480px}
.dialog-image{width:100%;height:100%;max-height:580px;object-fit:cover;background:#d9dfc9}
.dialog-copy{padding:75px 32px 40px;display:flex;flex-direction:column;justify-content:center}
.close{position:absolute;top:17px;right:17px;width:38px;height:38px;background:var(--paper);border:1px solid var(--line);border-radius:50%;cursor:pointer;font-size:24px;line-height:1;z-index:2}
.dialog-kicker{font:10px Arial,sans-serif;letter-spacing:.18em;direction:ltr;text-align:left;color:var(--muted)}
dialog h2{font-size:36px;font-weight:400;margin:15px 0}
.dialog-description{font-size:14px;line-height:2.2;color:#62665a}
.availability{font-size:12px;line-height:2;border-top:1px solid var(--line);margin:25px 0 0;padding-top:18px;color:var(--muted)}
.back{align-self:flex-start;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:10px 0;margin-top:20px;cursor:pointer;color:var(--ink);font-size:12px}
@media(max-width:1050px){.categories{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:390px}.site-header{height:116px}.intro{min-height:160px}}
@media(max-width:600px){.site-header{height:105px;margin:0 5%}.wordmark{font-size:53px}main{padding:0 5% 28px}.intro{display:block;padding:26px 0 24px;min-height:0}.eyebrow{font-size:8px;margin-bottom:10px}h1{font-size:27px}.intro-note{max-width:none;margin-top:11px;font-size:11px}.note-line{display:none}.categories{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:290px;gap:10px}.category.baby{grid-column:1/-1;height:310px}.category.baby img{object-position:center 45%}.category-label{bottom:18px;left:12px;right:12px;gap:6px}.category-label strong{font-size:22px}.category-label small{font-size:7px;letter-spacing:.05em;line-height:1.6}.arrow{width:27px;height:27px;font-size:16px}.number{left:12px;top:15px}.caption{align-items:flex-start;gap:12px;font-size:9px}.caption .english{font-size:7px;line-height:2}.dialog-grid{grid-template-columns:1fr;min-height:0}.dialog-image{height:280px;object-position:center 25%}.dialog-copy{padding:25px}dialog h2{font-size:28px;margin:10px 0}.availability{margin-top:15px}.close{top:12px;right:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="site-header"><a href="./" class="wordmark" aria-label="SAMUEL — Home">SAMUEL</a></header>
<main>
<section class="intro" aria-labelledby="intro-title">
<div><p class="eyebrow">THE EVERYDAY EDIT</p><h1 id="intro-title">Your choice. <span>Your style.</span></h1></div>
<p class="intro-note">Start with an image.<br>Find what feels like you.<span class="note-line"><b aria-hidden="true">↙</b>Tap an image to explore.</span></p>
</section>
<section class="categories" aria-label="Shop by collection">
<button class="category women" data-category="women" aria-label="Explore Women"><img src="img/women-collection.webp" alt="Woman in an oatmeal blazer and relaxed neutral trousers" fetchpriority="high" width="900" height="1350"><span class="number" aria-hidden="true">01 /</span><span class="category-label"><span><strong>Women</strong><small>YOUR EVERYDAY, ELEVATED</small></span><span class="arrow" aria-hidden="true">↗</span></span></button>
<button class="category men" data-category="men" aria-label="Explore Men"><img src="img/men-collection.webp" alt="Man wearing a chocolate suede jacket and ivory knit" width="900" height="1350"><span class="number" aria-hidden="true">02 /</span><span class="category-label"><span><strong>Men</strong><small>STYLE ON YOUR TERMS</small></span><span class="arrow" aria-hidden="true">↗</span></span></button>
<button class="category girls" data-category="girls" aria-label="Explore Girls"><img src="img/girls-collection.webp" alt="Girl in a sage green dress and cream sneakers" width="900" height="1350"><span class="number" aria-hidden="true">03 /</span><span class="category-label"><span><strong>Girls</strong><small>MADE FOR HER WORLD</small></span><span class="arrow" aria-hidden="true">↗</span></span></button>
<button class="category boys" data-category="boys" aria-label="Explore Boys"><img src="img/boys-collection.webp" alt="Boy in an ochre overshirt and beige trousers" width="900" height="1350"><span class="number" aria-hidden="true">04 /</span><span class="category-label"><span><strong>Boys</strong><small>READY FOR EVERY ADVENTURE</small></span><span class="arrow" aria-hidden="true">↗</span></span></button>
<button class="category baby" data-category="baby" aria-label="Explore Baby"><img src="img/baby-collection.webp" alt="Baby in a cream knitted romper on a soft blanket" width="900" height="1350"><span class="number" aria-hidden="true">05 /</span><span class="category-label"><span><strong>Baby</strong><small>LITTLE BEGINNINGS</small></span><span class="arrow" aria-hidden="true">↗</span></span></button>
</section>
<div class="caption" aria-hidden="true"><span class="category-note">For every age. For every you.</span><span class="english">LESS NOISE. MORE YOU.</span></div>
</main>
<dialog id="category-dialog" aria-labelledby="category-title" aria-describedby="category-description">
<button class="close" aria-label="Close preview">×</button>
<div class="dialog-grid"><img class="dialog-image" id="category-image" alt=""><div class="dialog-copy"><span class="dialog-kicker" id="category-kicker"></span><h2 id="category-title"></h2><p class="dialog-description" id="category-description"></p><p class="availability">This collection is taking shape.<br>Products will be arriving soon.</p><button class="back">← Back to categories</button></div></div>
</dialog>
<script>
const categories={
  "women": {
    "key": "women",
    "title": "Women",
    "kicker": "YOUR EVERYDAY, ELEVATED",
    "description": "Clothing, shoes and accessories for every side of you.",
    "image": "women-collection.webp",
    "alt": "Woman in an oatmeal blazer and relaxed neutral trousers"
  },
  "men": {
    "key": "men",
    "title": "Men",
    "kicker": "STYLE ON YOUR TERMS",
    "description": "From everyday essentials to tailoring, shoes and finishing touches.",
    "image": "men-collection.webp",
    "alt": "Man wearing a chocolate suede jacket and ivory knit"
  },
  "girls": {
    "key": "girls",
    "title": "Girls",
    "kicker": "MADE FOR HER WORLD",
    "description": "Everyday outfits, occasionwear, shoes and accessories for growing personalities.",
    "image": "girls-collection.webp",
    "alt": "Girl in a sage green dress and cream sneakers"
  },
  "boys": {
    "key": "boys",
    "title": "Boys",
    "kicker": "READY FOR EVERY ADVENTURE",
    "description": "Comfortable clothing, smart outfits, shoes and accessories for busy days.",
    "image": "boys-collection.webp",
    "alt": "Boy in an ochre overshirt and beige trousers"
  },
  "baby": {
    "key": "baby",
    "title": "Baby",
    "kicker": "LITTLE BEGINNINGS",
    "description": "Soft clothing, little shoes and everyday essentials for baby girls and boys.",
    "image": "baby-collection.webp",
    "alt": "Baby in a cream knitted romper on a soft blanket"
  }
};
const dialog=document.getElementById('category-dialog');
document.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>{
const category=categories[button.dataset.category];
document.getElementById('category-title').textContent=category.title;
document.getElementById('category-kicker').textContent=category.kicker;
document.getElementById('category-description').textContent=category.description;
const picture=document.getElementById('category-image');picture.src='img/'+category.image;picture.alt=button.querySelector('img').alt;picture.style.objectFit='cover';
dialog.showModal();document.body.style.overflow='hidden';
}));
dialog.querySelectorAll('.close,.back').forEach(button=>button.addEventListener('click',()=>dialog.close()));
dialog.addEventListener('close',()=>{document.body.style.overflow='';});
dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();}});
</script>
</body>
</html>
